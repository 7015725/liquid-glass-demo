name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Run engine unit tests
        run: ./gradlew :engine:testAndroidHostTest --stacktrace --no-configuration-cache

      - name: Run Android app unit tests
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace --no-configuration-cache

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease --stacktrace --no-configuration-cache

      - name: Rename APK
        run: |
          mkdir -p out
          cp androidApp/build/outputs/apk/release/*.apk out/LiquidGlassDemo.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassDemo-apk
          path: out/LiquidGlassDemo.apk

      - name: Publish to "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建 Latest build
          body: "自动构建：${{ github.sha }}"
          prerelease: false
          make_latest: true
          files: out/LiquidGlassDemo.apk
