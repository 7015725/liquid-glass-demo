name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# 默认只给读权限；写权限仅出现在发布 job，且只在 main 的 push 运行。
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLOWGLASS_KEYSTORE_PATH: /tmp/flowglass-release.jks
      FLOWGLASS_KEYSTORE_PASSWORD: ${{ secrets.FLOWGLASS_KEYSTORE_PASSWORD }}
      FLOWGLASS_KEY_ALIAS: ${{ secrets.FLOWGLASS_KEY_ALIAS }}
      FLOWGLASS_KEY_PASSWORD: ${{ secrets.FLOWGLASS_KEY_PASSWORD }}
    steps:
      # Action 一律锁定到提交 SHA（注释里保留人类可读的版本），避免可变标签被移动后执行未知代码。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Prepare fixed signing key
        env:
          FLOWGLASS_KEYSTORE_BASE64: ${{ secrets.FLOWGLASS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${FLOWGLASS_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Fixed release signing material is unavailable; refusing to build an unsigned-identity release."
            exit 1
          fi
          umask 077
          printf '%s' "$FLOWGLASS_KEYSTORE_BASE64" | base64 --decode > "$FLOWGLASS_KEYSTORE_PATH"
          echo "Fixed signing key prepared."

      - name: Test report guard
        run: python3 -m unittest discover -s .github/scripts -p 'test_test_report.py'

      - name: Run engine unit tests
        run: ./gradlew :engine:testAndroidHostTest --stacktrace --no-configuration-cache

      - name: Run Android app unit tests
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace --no-configuration-cache

      - name: Verify test counts
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/test_report.py

      - name: Upload unit test reports
        id: test-reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          if-no-files-found: error
          path: |
            engine/build/test-results/testAndroidHostTest/TEST-*.xml
            androidApp/build/test-results/testDebugUnitTest/TEST-*.xml
            out/unit-test-summary.json

      - name: Lint release
        run: ./gradlew :androidApp:lintRelease --stacktrace --no-configuration-cache

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease --stacktrace --no-configuration-cache

      - name: Collect release APK
        run: |
          mkdir -p out
          APK=$(find androidApp/build/outputs/apk/release -maxdepth 1 -name 'flowglass-*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" out/
          ls -la out

      - name: Verify release certificate
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          test -n "$APKSIGNER"
          APK=$(find out -maxdepth 1 -name 'flowglass-*.apk' -print -quit)
          # apksigner prefixes the line differently across build-tools ("V2 Signer: ..." vs "Signer #1 ...").
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d '\r')
          echo "release certificate sha256: $CERT"
          test "$CERT" = "801316ba3da40cfb6700b3224d13f5ee786c609e3cc2369fa4768b9a5efdaee6"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LiquidGlassDemo-apk
          path: out/flowglass-*.apk

      - name: Remove signing keystore
        if: always()
        run: rm -f "$FLOWGLASS_KEYSTORE_PATH"

  # 发布单独成 job：只有它在 main 的 push 运行，权限才提升到 contents: write，
  # 构建 job 不接触仓库写令牌；签名材料也不跨 job 传递。
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LiquidGlassDemo-apk
          path: out

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: 最新构建 Latest build
          body: "自动构建：${{ github.sha }}"
          prerelease: false
          make_latest: true
          files: out/flowglass-*.apk

      # "latest" 是固定 release，资产只会追加；不清理的话页面上会堆一长串 alpha，最容易被认成旧版本。
      # 上传成功后再删旧的：万一上传失败，latest 里至少还有上一版可用。
      - name: Keep only the newest APK in "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          KEEP=$(basename "$(find out -maxdepth 1 -name 'flowglass-*.apk' -print -quit)")
          test -n "$KEEP"
          echo "保留：$KEEP"
          gh api "repos/$REPO/releases/tags/latest" --jq '.assets[].name' > /tmp/assets.txt
          while read -r name; do
            [ -n "$name" ] || continue
            case "$name" in
              *.apk) ;;
              *) continue ;;
            esac
            if [ "$name" = "$KEEP" ]; then
              continue
            fi
            echo "删除旧资产：$name"
            gh release delete-asset latest "$name" --repo "$REPO" --yes
          done < /tmp/assets.txt
          echo "剩余资产："
          gh api "repos/$REPO/releases/tags/latest" --jq '.assets[].name'
