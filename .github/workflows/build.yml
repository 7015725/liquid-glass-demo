name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease --stacktrace --no-configuration-cache

      - name: Rename APK
        run: |
          mkdir -p out
          cp androidApp/build/outputs/apk/release/*.apk out/LiquidGlassDemo.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassDemo-apk
          path: out/LiquidGlassDemo.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建 Latest build
          body: "自动构建：${{ github.sha }}"
          prerelease: false
          make_latest: true
          files: out/LiquidGlassDemo.apk
